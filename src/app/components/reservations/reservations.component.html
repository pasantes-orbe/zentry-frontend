<!-- src/app/components/reservations/reservations.component.html -->

<!-- CARD DE LISTADO (cuando NO está cargando) -->
<ion-card *ngIf="!isLoading(); else loading">
  <!-- Nos suscribimos al observable con async y lo aliasamos a 'reservations' -->
  <div class="table-responsive container padding-top" *ngIf="reservations$ | async as reservations">
    <h5>Reserva de Eventos</h5>

    <table class="table">
      <thead>
        <tr>
          <th scope="col">Estado</th>
          <th scope="col">Reserva</th>
          <th scope="col">Fecha</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let reservation of reservations; index as i">
          <td>
            <ng-container [ngSwitch]="reservation?.status">
              <ion-badge *ngSwitchCase="'pendiente'" color="warning">{{ reservation.status }}</ion-badge>
              <ion-badge *ngSwitchCase="'rechazado'" color="danger">{{ reservation.status }}</ion-badge>
              <ion-badge *ngSwitchCase="'aprobado'" color="success">{{ reservation.status }}</ion-badge>
              <ion-badge *ngSwitchDefault color="medium">{{ reservation?.status || '—' }}</ion-badge>
            </ng-container>
          </td>
          <td>{{ reservation?.amenity?.name || '—' }}</td>
          <td>{{ reservation?.date | date:'dd/MM/yyyy HH:mm' }}</td>
        </tr>

        <!-- Fila vacía cuando no hay datos -->
        <tr *ngIf="!reservations || reservations.length === 0">
          <td colspan="3" class="text-center">No hay reservas.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="buttons text-center mt-2 mb-2">
    <ion-button fill="clear">
      <ion-icon slot="end" name="search-outline"></ion-icon>
      Ver Todos
    </ion-button>

    <ion-button (click)="Navigation.navigate('/reservar')" shape="round">
      <ion-icon slot="end" name="add"></ion-icon>
      Agregar
    </ion-button>
  </div>
</ion-card>

<!--

-->
