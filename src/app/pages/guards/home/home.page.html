<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start" class="header-brand">
      <img src="assets/logos/logo-48.png" class="header-logo" alt="Zentry Logo" />
      <span class="header-title-text"></span>
    </ion-buttons>
    
    <ion-buttons slot="end">
      <ion-button fill="clear" class="notification-button">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
      
      <!-- El avatar ahora funciona como disparador del popover -->
      <ion-avatar id="user-popover-trigger">
        <img [src]="'https://placehold.co/64x64/374151/FFFFFF?text=' + userInitial" />
      </ion-avatar>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="guards-content">
  <!-- Popover para el menú de usuario -->
  <ion-popover trigger="user-popover-trigger" triggerAction="click" [dismissOnSelect]="true" side="bottom" alignment="end" class="user-popover">
    <ng-template>
      <ion-list lines="none">
        <ion-item>
          <ion-icon name="moon-outline" slot="start"></ion-icon>
          <ion-label>Modo Oscuro</ion-label>
          <ion-toggle
            slot="end"
            [checked]="theme.isDark()"
            (ionChange)="onThemeToggle($event)"
            aria-label="Cambiar tema">
          </ion-toggle>
        </ion-item>
        <ion-item button="true" detail="false" (click)="logout()" color="danger">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Cerrar Sesión</ion-label>
        </ion-item>
      </ion-list>
    </ng-template>
  </ion-popover>

  <div class="guards-header">
    <ion-avatar class="guard-photo">
      <ion-icon name="shield-outline" class="guard-icon"></ion-icon>
    </ion-avatar>
    <!-- El nombre ahora se obtiene desde el archivo TS -->
    <h2>{{ userName }}</h2>
    <p>Panel de control</p>
  </div>

  <div class="actions-container">
    <div class="action-card" (click)="navigateToCheckin()">
      <div class="icon-background">
        <ion-icon name="arrow-forward-circle-outline"></ion-icon>
      </div>
      <h3>REGISTRAR INGRESO</h3>
    </div>

    <div class="action-card" (click)="navigateToAuthorizations()">
      <div class="icon-background">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
      </div>
      <h3>VER AUTORIZACIONES</h3>
    </div>

    <div class="action-card" (click)="navigateToCheckout()">
      <div class="icon-background">
        <ion-icon name="arrow-back-circle-outline"></ion-icon>
      </div>
      <h3>REGISTRAR EGRESO</h3>
    </div>
  </div>

</ion-content>
