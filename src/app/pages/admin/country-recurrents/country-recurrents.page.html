<!-- pages/admin/country-recurrents/country-recurrents.page.html -->
<app-navbar-back title="Invitados Recurrentes"></app-navbar-back>

<ion-content class="ion-padding">
  <ion-spinner *ngIf="loading"></ion-spinner>

  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let r of recurrents; let i = index">
      <ion-label>
        <h2>{{ r.guest_lastname }} {{ r.guest_name }}</h2>
        <p>DNI: {{ r.dni }}</p>
      </ion-label>


      <!-- Acciones -->
      <div class="actions" slot="end">
        <ion-button class="status-btn" size="small" fill="outline" [color]="r.status ? 'success' : 'medium'" (click)="r.status ? desactivar(r, i) : activar(r, i)" [title]="r.status ? 'Desactivar recurrente' : 'Activar recurrente'">
          {{ r.status ? 'Activo' : 'Inactivo' }}
        </ion-button>
        <ion-button fill="outline" size="small"
          [routerLink]="countryIdFromUrl
            ? ['/admin/country', countryIdFromUrl, 'recurrents', 'edit', r.id]
            : ['/admin/edit-recurrent', r.id]">
          Editar
        </ion-button>
        <ion-button color="danger" fill="outline" size="small" (click)="eliminar(r, i)">
          Eliminar
        </ion-button>
      </div>
    </ion-item>
  </ion-list>

  <p *ngIf="!loading && recurrents.length === 0">No hay invitados recurrentes.</p>
</ion-content>
